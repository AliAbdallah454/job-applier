# Proves to Let's Encrypt that this cluster serves the host, by answering a challenge over HTTP
# on port 80 through Traefik.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt
spec:
  acme:
    {{- if .Values.tls.staging }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    {{- else }}
    server: https://acme-v02.api.letsencrypt.org/directory
    {{- end }}
    email: "{{ required "Set tls.email for Let's Encrypt" .Values.tls.email }}"
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
