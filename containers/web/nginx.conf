# Serves the built web app. /api never reaches this server: the ingress sends it to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # File names under /assets carry a content hash, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Any other path is a page of the app, which the router in index.html shows.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
