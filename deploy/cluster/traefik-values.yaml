# Traefik, the ingress controller, behind the Network Load Balancer of the Cluster stack. The
# balancer sends ports 80 and 443 to these node ports on each worker; keep them in step with
# TRAEFIK_PORTS in infra/cluster_stack.py. Installed once per cluster: see docs/kubernetes.md.
ports:
  web:
    nodePort: 30080
    # Every plain HTTP request goes to HTTPS, including Let's Encrypt's checks, which follow
    # the redirect and do not check the certificate there.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    nodePort: 30443
service:
  spec:
    # The chart reads the type here; a `service.type` key is ignored.
    type: NodePort
    # A node passes node port traffic only to a Traefik pod on itself, never on to another
    # node. A worker without one then fails the balancer's health check and is skipped, and
    # Traefik sees the visitor's own address.
    externalTrafficPolicy: Local
# One copy per worker, so the site stays up while a worker is down or being replaced.
deployment:
  replicas: 2
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    # Count only the workers. By default the tainted control plane counts too, with its zero
    # Traefik pods, so no worker could ever hold two, not even for a moment during an update.
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
# `kubectl drain` stops at the last running copy instead of taking the site down.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
