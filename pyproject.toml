[project]
name = "job-applier"
version = "0.1.0"
description = "Job discovery and application assistant"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5,<6",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
