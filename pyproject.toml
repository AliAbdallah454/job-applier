[project]
name = "job-applier"
version = "0.1.0"
description = "Job discovery and application assistant"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "botocore[crt]>=1.43.119",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.3,<7",
    "typesafe-sdk>=0.7.5,<0.8",
]

[dependency-groups]
api = [
    "fastapi>=0.115,<1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]
dev = [
    {include-group = "api"},
    "moto[dynamodb,secretsmanager,sqs]>=5,<6",
    "ruff>=0.11,<1",
]
infra = [
    "aws-cdk-lib>=2.200,<3",
    "constructs>=10,<11",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
