AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GitHub Actions deploy role for job-applier. Deploy once by hand; it is not part of the
  CDK app so CI never changes its own permissions.

Parameters:
  RepositorySubject:
    Type: String
    Default: AliAbdallah454@81486153/job-applier@1435953037
    Description: >-
      Repository as it appears in GitHub's OIDC subject claim. GitHub now appends numeric
      owner and repository IDs (owner@ID/repo@ID). Read it from the failed AssumeRole event in CloudTrail.
  Environment:
    Type: String
    Default: ci_cd_deploy_env
    Description: GitHub Actions environment whose jobs may assume the role (jobs that use an environment get an environment-based OIDC subject).
  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: Qualifier of the CDK bootstrap stack (default unless customized).
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Use "false" if this account already has the token.actions.githubusercontent.com provider.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: job-applier-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${RepositorySubject}:environment:${Environment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CdkBootstrapRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-*
              - Sid: CdkBootstrapVersion
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/${CdkQualifier}/version
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushWorkerImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/jobpipeline/*
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/application/*

Outputs:
  DeployRoleArn:
    Description: Save as the GitHub Actions variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
