name: CI/CD

# Pull requests: tests only. Pushes to main: tests, deploy both CDK stacks, then build and
# push the worker images whose contents changed. Each image is tagged with a hash of its
# inputs (scripts/image_tag.sh), so unchanged images keep their tag and their ECS task
# definition does not change. See docs/ci-cd.md.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "frontend/**"]
  workflow_dispatch:

# One deployment at a time: ECR tags are immutable and CloudFormation locks a stack anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --group infra
      - run: npm ci
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m unittest discover -s backend/tests -v
      - run: uv run python -m unittest discover -s scripts/tests -v
      - run: uv run --group infra python -m unittest discover -s infra/tests -v
      - run: npm run synth -- --quiet

  deploy-infra:
    # Creates the ECR repositories (first run) and points each ECS task definition at its
    # image's content tag. CloudFormation skips resources that did not change.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: ci_cd_deploy_env
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --group infra
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Compute image tags
        # Keep in step with the push-images matrix below.
        run: |
          {
            echo "CDK_CONTEXT<<EOF"
            echo "-c seedImageTag=$(scripts/image_tag.sh containers/Dockerfile.seed)"
            echo "-c scraperImageTag=$(scripts/image_tag.sh containers/Dockerfile.scrape)"
            echo "-c classifierImageTag=$(scripts/image_tag.sh containers/Dockerfile.classify)"
            echo "-c documentsImageTag=$(scripts/image_tag.sh containers/Dockerfile.documents)"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Show infrastructure changes
        run: npx cdk diff JobPipeline Application $CDK_CONTEXT || true
      - name: Deploy infrastructure
        run: npx cdk deploy JobPipeline Application --require-approval never $CDK_CONTEXT

  push-images:
    needs: deploy-infra
    runs-on: ubuntu-latest
    environment: ci_cd_deploy_env
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each entry links one Dockerfile to one ECR repository (<lowercase-stack>/<worker>).
        include:
          - repository: jobpipeline/seed
            dockerfile: containers/Dockerfile.seed
          - repository: jobpipeline/scraper
            dockerfile: containers/Dockerfile.scrape
          - repository: jobpipeline/classifier
            dockerfile: containers/Dockerfile.classify
          - repository: application/documents
            dockerfile: containers/Dockerfile.documents
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - id: existing
        # The tag is a content hash: if it is already in ECR, the image is unchanged.
        run: |
          tag=$(scripts/image_tag.sh "${{ matrix.dockerfile }}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "${{ matrix.repository }}" \
              --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.published != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.login.outputs.registry }}/${{ matrix.repository }}:${{ steps.existing.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.repository }}
          cache-to: type=gha,scope=${{ matrix.repository }},mode=max
