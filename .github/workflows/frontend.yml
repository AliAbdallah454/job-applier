name: Frontend

# Separate from ci-cd.yml, which ignores frontend-only pushes because they deploy nothing.
on:
  pull_request:
    paths: ["frontend/**", "backend/**", "pyproject.toml", "uv.lock"]
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", "pyproject.toml", "uv.lock"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Fail if the generated API types are out of date
        run: |
          npm run types
          git diff --exit-code -- openapi.json src/api/schema.d.ts
