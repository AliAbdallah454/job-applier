name: Cluster

# The Kubernetes deployment (docs/kubernetes.md). After CI/CD or Frontend succeeds on a push to
# main: deploy the Cluster stack, then build and push the API and web images whose contents
# changed, tagged with a hash of their inputs (scripts/image_tag.sh). It stops there: GitHub
# cannot reach the cluster, whose API port is closed, so `helm upgrade` is run by hand with the
# tags this workflow prints in its summary.
on:
  workflow_run:
    workflows: ["CI/CD", "Frontend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Both triggers can fire for one push; the second run finds nothing to do.
concurrency:
  group: cluster
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-cluster:
    # Only after tests passed on a push to main, or when started by hand on main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ci_cd_deploy_env
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit that was tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --group infra
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Show infrastructure changes
        run: npx cdk diff Cluster || true
      - name: Deploy infrastructure
        # Creates the servers on the first run. Later runs change only what differs; a change
        # to the server image or node-setup.sh restarts or replaces the servers, so check the
        # diff above before merging such a change.
        run: npx cdk deploy Cluster --require-approval never

  push-images:
    needs: deploy-cluster
    runs-on: ubuntu-latest
    environment: ci_cd_deploy_env
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each entry links one Dockerfile to one ECR repository of the Cluster stack.
        include:
          - repository: cluster/api
            dockerfile: containers/Dockerfile.api
          - repository: cluster/web
            dockerfile: containers/Dockerfile.web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - id: existing
        # The tag is a content hash: if it is already in ECR, the image is unchanged.
        run: |
          tag=$(scripts/image_tag.sh "${{ matrix.dockerfile }}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "${{ matrix.repository }}" \
              --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.published != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.login.outputs.registry }}/${{ matrix.repository }}:${{ steps.existing.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.repository }}
          cache-to: type=gha,scope=${{ matrix.repository }},mode=max
      - name: Summary
        run: |
          state=${{ steps.existing.outputs.published == 'true' && 'unchanged' || 'pushed' }}
          echo "**${{ matrix.repository }}** ($state): \`${{ steps.existing.outputs.tag }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

  upgrade-command:
    needs: push-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Print the helm upgrade command
        # Computed again rather than passed between matrix jobs, which cannot share outputs.
        run: |
          {
            echo "### Install these images"
            echo '```sh'
            echo "helm upgrade job-applier deploy/helm/job-applier -n job-applier --reuse-values \\"
            echo "  --set images.api.tag=$(scripts/image_tag.sh containers/Dockerfile.api) \\"
            echo "  --set images.web.tag=$(scripts/image_tag.sh containers/Dockerfile.web)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
